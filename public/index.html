<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Invoice</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <script src="/js/auth.js"></script>
  </head>
  <body>
    <div class="app-wrapper">
      <!-- Navigation -->
      <nav>
        <div class="nav-brand">
          <span><i class="fa-solid fa-receipt"></i> POS System</span>
        </div>
        <a href="/" class="active"
          ><span><i class="fa-solid fa-pen-to-square"></i></span>
          <span>Create Invoice</span></a
        >
        <a href="/invoices"
          ><span><i class="fa-solid fa-folder-open"></i></span>
          <span>View Invoices</span></a
        >
        <a href="/products" class="admin-only"
          ><span><i class="fa-solid fa-boxes-stacked"></i></span>
          <span>Manage Products</span></a
        >
        <a href="/report" class="admin-only"
          ><span><i class="fa-solid fa-chart-line"></i></span>
          <span>Report</span></a
        >
        <a href="/users.html" class="admin-only"
          ><span><i class="fa-solid fa-users-gear"></i></span>
          <span>Users</span></a
        >

        <div class="user-profile">
          <div id="user-avatar" class="user-avatar">?</div>
          <div class="profile-info">
            <span id="user-full-name" class="profile-name">Loading...</span>
            <span id="user-role" class="profile-role">...</span>
          </div>
        </div>
        <a href="#" id="logout-btn" class="logout-link">
          <span><i class="fa-solid fa-right-from-bracket"></i></span>
          <span>Logout</span>
        </a>
      </nav>

      <main class="main-content">
        <div class="container">
          <header style="margin-bottom: 2rem">
            <h1>Create New Invoice</h1>
            <p style="color: var(--text-muted)">
              Enter details below to generate a point-of-sale receipt.
            </p>
          </header>

          <!-- Messages -->
          <div id="messageContainer"></div>

          <!-- Invoice Form -->
          <form id="invoiceForm">
            <div class="card">
              <div class="form-group" style="max-width: 300px">
                <label for="invoiceNumber">Invoice Number</label>
                <input
                  type="text"
                  id="invoiceNumber"
                  readonly
                  placeholder="Generating..."
                />
              </div>

              <!-- Items Section -->
              <div class="items-section">
                <div class="items-header">
                  <div>Item Name</div>
                  <div style="text-align: center">Qty</div>
                  <div>Unit</div>
                  <div>Price</div>
                  <div style="text-align: right">Subtotal</div>
                  <div></div>
                </div>
                <div id="itemsContainer"></div>

                <button
                  type="button"
                  class="btn btn-secondary"
                  onclick="app.addItemRow()"
                  style="
                    margin-top: 1rem;
                    background: #f1f5f9;
                    color: var(--text-main);
                    border: 1px dashed var(--border);
                  "
                >
                  <i class="fa-solid fa-plus"></i> Add Line Item
                </button>
              </div>

              <!-- Totals -->
              <div
                style="
                  margin-top: 2rem;
                  padding-top: 2rem;
                  border-top: 2px solid var(--border);
                  display: flex;
                  justify-content: flex-end;
                "
              >
                <div style="text-align: right">
                  <span
                    style="
                      display: block;
                      font-size: 0.875rem;
                      color: var(--text-muted);
                      margin-bottom: 0.5rem;
                    "
                    >Grand Total</span
                  >
                  <div
                    id="totalAmount"
                    style="
                      font-weight: 800;
                      font-size: 2rem;
                      color: var(--primary);
                    "
                  >
                    $ 0.000 = ៛ 0
                  </div>
                </div>
              </div>

              <!-- Action Buttons -->
              <div
                style="
                  margin-top: 2rem;
                  display: flex;
                  gap: 1rem;
                  justify-content: flex-end;
                "
              >
                <button
                  type="reset"
                  class="btn"
                  style="
                    background: transparent;
                    border: 1px solid var(--border);
                    color: var(--text-main);
                  "
                >
                  Clear Form
                </button>
                <button
                  type="submit"
                  class="btn btn-success"
                  id="submitBtn"
                  style="padding: 1rem 2rem; font-size: 1.1rem"
                >
                  <i class="fa-solid fa-floppy-disk"></i> Save & Preview
                </button>
              </div>
            </div>
          </form>

          <!-- Receipt Preview for Printing -->
          <div
            id="receiptContainer"
            style="display: none"
            class="receipt-preview-container"
          ></div>
        </div>
      </main>
    </div>

    <!-- JavaScript -->
    <script src="/js/app.js"></script>
  </body>
</html>
